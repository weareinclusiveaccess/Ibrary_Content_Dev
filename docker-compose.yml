version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ibrary-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ibrary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ibrary_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ibrary}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ibrary}"]
      interval: 5s
      timeout: 5s
      retries: 5

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: ibrary-dynamodb
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
