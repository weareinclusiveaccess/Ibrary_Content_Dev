name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check code formatting with Black
        run: |
          if [ -d "src" ] || [ -d "tests" ]; then
            uv run black --check src tests 2>/dev/null || uv run black --check src tests
          else
            echo "No source directories found, skipping black check"
          fi

      - name: Check import sorting with isort
        run: |
          if [ -d "src" ] || [ -d "tests" ]; then
            uv run isort --check-only src tests 2>/dev/null || uv run isort --check-only src tests
          else
            echo "No source directories found, skipping isort check"
          fi

      - name: Lint with ruff
        run: |
          if [ -d "src" ] || [ -d "tests" ]; then
            uv run ruff check src tests
          else
            echo "No source directories found, skipping ruff check"
          fi

      - name: Format with ruff (as secondary check)
        run: |
          if [ -d "src" ] || [ -d "tests" ]; then
            uv run ruff format --check src tests
          else
            echo "No source directories found, skipping ruff format check"
          fi

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Type check with mypy
        run: uv run mypy src
        continue-on-error: true

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        if: steps.setup-python.outcome == 'success'
        run: uv sync --extra dev

      - name: Check if tests exist
        if: steps.setup-python.outcome == 'success'
        id: check_tests
        run: |
          if [ -d "tests" ] && [ "$(find tests -name '*.py' -type f | wc -l)" -gt 0 ]; then
            echo "tests_exist=true" >> $GITHUB_OUTPUT
          else
            echo "tests_exist=false" >> $GITHUB_OUTPUT
          fi

      - name: Run tests with pytest
        if: steps.setup-python.outcome == 'success' && steps.check_tests.outputs.tests_exist == 'true'
        run: uv run pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

      - name: Create empty coverage file if no tests
        if: steps.setup-python.outcome == 'success' && steps.check_tests.outputs.tests_exist == 'false'
        run: |
          echo '<?xml version="1.0" ?><coverage></coverage>' > coverage.xml
          echo "No tests found, skipping pytest"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync

      - name: Run safety check
        run: |
          pip install safety
          safety check --file uv.lock || true

      - name: Run bandit security linter
        run: |
          if [ -d "src" ] && [ "$(find src -name '*.py' -type f | wc -l)" -gt 0 ]; then
            pip install bandit[toml]
            bandit -r src -f json -o bandit-report.json || true
          else
            echo '{"errors": []}' > bandit-report.json
            echo "No Python files found in src, skipping bandit"
          fi
        continue-on-error: true

      - name: Upload bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
