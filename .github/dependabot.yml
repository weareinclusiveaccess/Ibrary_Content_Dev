version: 2
updates:
  # Enable version updates for GitHub Actions only
  # Note: Dependabot doesn't support UV/uv.lock yet, so Python dependencies must be updated manually
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
