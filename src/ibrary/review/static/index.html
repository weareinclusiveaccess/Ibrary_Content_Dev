<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IBrary — Content Review</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3d9cf5;
      --ok: #3ecf8e;
      --warn: #f5a623;
      --bad: #f56565;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
    }
    header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
    .layout { display: grid; grid-template-columns: 340px 1fr; min-height: calc(100vh - 57px); }
    aside {
      border-right: 1px solid var(--border);
      overflow: auto;
      background: var(--surface);
    }
    main { overflow: auto; padding: 1.25rem 1.5rem; }
    .filters { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 0.5rem; }
    input, select, button, textarea {
      font: inherit;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 0.4rem 0.6rem;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 500;
    }
    button.secondary { background: transparent; border-color: var(--border); color: var(--text); }
    button.ok { background: var(--ok); border-color: var(--ok); }
    button.warn { background: var(--warn); border-color: var(--warn); color: #111; }
    .unit-list { list-style: none; margin: 0; padding: 0; }
    .unit-list li {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .unit-list li:hover, .unit-list li.active { background: #243044; }
    .unit-list .title { font-weight: 500; font-size: 0.9rem; }
    .unit-list .meta { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      margin-right: 0.25rem;
    }
    .badge.pass { background: #1e3d2f; color: var(--ok); }
    .badge.fail { background: #3d1e1e; color: var(--bad); }
    .badge.status { background: #2a3548; color: var(--muted); }
    .split { display: grid; grid-template-columns: 1fr 320px; gap: 1.25rem; }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }
    .lesson h2 { margin-top: 1.2rem; }
    .lesson img { max-width: 100%; border-radius: 6px; margin: 0.5rem 0; }
    .figures { margin-top: 1rem; }
    .figure-card {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
    }
    .figure-card img { max-width: 100%; display: block; margin-top: 0.5rem; }
    .judge h3 { margin: 0.75rem 0 0.35rem; font-size: 0.85rem; color: var(--muted); }
    .score-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin: 0.25rem 0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { border: 1px solid var(--border); padding: 0.35rem 0.5rem; text-align: left; }
    .actions { display: flex; gap: 0.5rem; margin: 1rem 0; flex-wrap: wrap; }
    #login-screen {
      max-width: 400px;
      margin: 4rem auto;
      padding: 2rem;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .hidden { display: none !important; }
    .empty { color: var(--muted); padding: 2rem; text-align: center; }
    ul.recs { padding-left: 1.2rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div id="login-screen">
    <h1>IBrary Review</h1>
    <p style="color: var(--muted); font-size: 0.9rem;">Enter your review API key (from <code>REVIEW_API_KEY</code> in .env).</p>
    <label style="display:block; margin: 1rem 0 0.35rem;">API key</label>
    <input type="password" id="api-key-input" style="width:100%" placeholder="X-Review-Api-Key" />
    <button id="login-btn" style="width:100%; margin-top: 1rem;">Continue</button>
  </div>

  <div id="app" class="hidden">
    <header>
      <h1>IBrary — Content Review</h1>
      <button class="secondary" id="logout-btn">Sign out</button>
    </header>
    <div class="layout">
      <aside>
        <div class="filters">
          <input type="search" id="search-q" placeholder="Search…" style="flex:1; min-width:120px" />
          <select id="filter-status">
            <option value="">All statuses</option>
            <option value="draft">draft</option>
            <option value="draft_curriculum_only">draft_curriculum_only</option>
            <option value="verified">verified</option>
            <option value="published">published</option>
          </select>
          <button id="refresh-btn" class="secondary">Refresh</button>
        </div>
        <ul class="unit-list" id="unit-list"></ul>
        <p class="meta" id="list-meta" style="padding: 0.5rem 1rem; font-size: 0.75rem; color: var(--muted);"></p>
      </aside>
      <main id="main-panel">
        <p class="empty">Select a unit from the list to review.</p>
      </main>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "ibrary_review_api_key";
    let apiKey = sessionStorage.getItem(STORAGE_KEY) || "";

    const $ = (id) => document.getElementById(id);

    function headers() {
      return { "X-Review-Api-Key": apiKey, "Content-Type": "application/json" };
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, { ...opts, headers: { ...headers(), ...opts.headers } });
      if (res.status === 403) throw new Error("Invalid API key");
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || res.statusText);
      }
      return res.status === 204 ? null : res.json();
    }

    function showApp() {
      $("login-screen").classList.add("hidden");
      $("app").classList.remove("hidden");
      loadList();
    }

    $("login-btn").onclick = () => {
      apiKey = $("api-key-input").value.trim();
      if (!apiKey) return;
      sessionStorage.setItem(STORAGE_KEY, apiKey);
      showApp();
    };

    $("logout-btn").onclick = () => {
      sessionStorage.removeItem(STORAGE_KEY);
      apiKey = "";
      location.reload();
    };

    if (apiKey) showApp();

    let selectedId = null;

    async function loadList() {
      const q = $("search-q").value.trim();
      const status = $("filter-status").value;
      const params = new URLSearchParams({ limit: "100" });
      if (q) params.set("q", q);
      if (status) params.set("status", status);
      try {
        const data = await api(`/review/units?${params}`);
        $("list-meta").textContent = `${data.total} unit(s)`;
        const ul = $("unit-list");
        ul.innerHTML = "";
        data.items.forEach((item) => {
          const li = document.createElement("li");
          if (item.curriculum_unit_id === selectedId) li.classList.add("active");
          const passBadge = item.passed === true
            ? '<span class="badge pass">pass</span>'
            : item.passed === false ? '<span class="badge fail">fail</span>' : "";
          li.innerHTML = `
            <div class="title">${escapeHtml(item.title || item.curriculum_unit_id)}</div>
            <div class="meta">
              <span class="badge status">${escapeHtml(item.status)}</span>
              ${passBadge}
              T${item.theme_number} · topic ${item.topic_number}
              ${item.overall_score != null ? ` · ${item.overall_score.toFixed(1)}` : ""}
            </div>`;
          li.onclick = () => selectUnit(item.curriculum_unit_id);
          ul.appendChild(li);
        });
      } catch (e) {
        alert(e.message);
      }
    }

    $("refresh-btn").onclick = loadList;
    $("search-q").onkeydown = (e) => { if (e.key === "Enter") loadList(); };
    $("filter-status").onchange = loadList;

    async function selectUnit(id) {
      selectedId = id;
      loadList();
      const main = $("main-panel");
      main.innerHTML = "<p class='empty'>Loading…</p>";
      try {
        const [unit, judge] = await Promise.all([
          api(`/review/units/${encodeURIComponent(id)}`),
          api(`/review/units/${encodeURIComponent(id)}/judge`),
        ]);
        renderDetail(unit, judge);
      } catch (e) {
        main.innerHTML = `<p class="empty">${escapeHtml(e.message)}</p>`;
      }
    }

    function renderDetail(unit, judge) {
      const lessonHtml = marked.parse(unit.curated_content_md || "");
      const figures = (unit.images || []).map((img) => `
        <div class="figure-card">
          <strong>${escapeHtml(img.image_id)}</strong>
          <p>${escapeHtml(img.caption || img.alt_text || "")}</p>
          ${img.display_url ? `<img src="${escapeHtml(img.display_url)}" alt="${escapeHtml(img.alt_text || "")}" />` : ""}
        </div>`).join("");

      const cps = (judge.checkpoint_scores || []).map((cp) => `
        <tr><td>${escapeHtml(cp.checkpoint_id)}</td><td>${cp.score}</td><td>${escapeHtml(cp.notes || "")}</td></tr>`).join("");

      const recs = (judge.recommendations || []).map((r) => `<li>${escapeHtml(r)}</li>`).join("");

      $("main-panel").innerHTML = `
        <h2 style="margin-top:0">${escapeHtml(unit.title || unit.curriculum_unit_id)}</h2>
        <p style="color:var(--muted); font-size:0.85rem">${escapeHtml(unit.subtopic || "")} · <code>${escapeHtml(unit.curriculum_unit_id)}</code></p>
        <div class="actions">
          <button class="ok" data-status="verified">Approve (verified)</button>
          <button class="warn" data-status="draft">Send back to draft</button>
        </div>
        <div class="split">
          <div>
            <div class="panel lesson">${lessonHtml}</div>
            ${figures ? `<div class="figures panel"><h3>Figures</h3>${figures}</div>` : ""}
          </div>
          <div class="panel judge">
            <h3 style="margin-top:0">UDL judge</h3>
            <div class="score-row"><span>Overall</span><strong>${fmt(judge.overall_score)} ${judge.passed ? "✓ pass" : judge.passed === false ? "✗ fail" : ""}</strong></div>
            <div class="score-row"><span>Representation</span><span>${fmt(judge.representation_score)}</span></div>
            <div class="score-row"><span>Engagement</span><span>${fmt(judge.engagement_score)}</span></div>
            <div class="score-row"><span>Action & expression</span><span>${fmt(judge.action_expression_score)}</span></div>
            <div class="score-row"><span>Correctness</span><span>${fmt(judge.correctness_score)}</span></div>
            ${judge.correctness_notes ? `<p style="font-size:0.8rem;color:var(--muted)">${escapeHtml(judge.correctness_notes)}</p>` : ""}
            <div class="score-row"><span>Clarity</span><span>${fmt(judge.clarity_score)}</span></div>
            ${judge.clarity_notes ? `<p style="font-size:0.8rem;color:var(--muted)">${escapeHtml(judge.clarity_notes)}</p>` : ""}
            ${cps ? `<h3>Checkpoints</h3><table><thead><tr><th>ID</th><th>Score</th><th>Notes</th></tr></thead><tbody>${cps}</tbody></table>` : ""}
            ${recs ? `<h3>Recommendations</h3><ul class="recs">${recs}</ul>` : ""}
            <h3>Reviewer note</h3>
            <textarea id="reviewer-notes" rows="3" style="width:100%"></textarea>
            <button id="save-notes" class="secondary" style="margin-top:0.5rem">Save note</button>
          </div>
        </div>`;

      document.querySelectorAll("[data-status]").forEach((btn) => {
        btn.onclick = async () => {
          try {
            await api(`/review/units/${encodeURIComponent(unit.curriculum_unit_id)}/status`, {
              method: "PATCH",
              body: JSON.stringify({ status: btn.dataset.status }),
            });
            loadList();
            selectUnit(unit.curriculum_unit_id);
          } catch (e) { alert(e.message); }
        };
      });

      $("save-notes").onclick = async () => {
        const notes = $("reviewer-notes").value.trim();
        if (!notes) return;
        try {
          await api(`/review/units/${encodeURIComponent(unit.curriculum_unit_id)}/notes`, {
            method: "POST",
            body: JSON.stringify({ notes, checked_by: "reviewer" }),
          });
          alert("Note saved.");
        } catch (e) { alert(e.message); }
      };
    }

    function fmt(n) { return n == null ? "—" : Number(n).toFixed(1); }
    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  </script>
</body>
</html>
